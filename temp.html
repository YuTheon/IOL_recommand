<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>眼轴长度和角膜曲率半径收集</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-container {
            max-width: 400px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .output {
            margin-top: 10px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>收集左右眼数据</h2>
        <form id="eyeDataForm">
            <div class="form-group">
                <label for="leftEyeAL">左眼眼轴长度 (mm):</label>
                <input type="number" id="leftEyeAL" name="leftEyeAL" step="0.01" placeholder="请输入左眼眼轴长度" required>
            </div>
            <div class="form-group">
                <label for="leftEyeCR">左眼角膜曲率半径 (mm):</label>
                <input type="number" id="leftEyeCR" name="leftEyeCR" step="0.01" placeholder="请输入左眼角膜曲率半径" required>
            </div>
            <div class="output" id="leftEyeSEOutput"></div>

            <div class="form-group">
                <label for="rightEyeAL">右眼眼轴长度 (mm):</label>
                <input type="number" id="rightEyeAL" name="rightEyeAL" step="0.01" placeholder="请输入右眼眼轴长度" required>
            </div>
            <div class="form-group">
                <label for="rightEyeCR">右眼角膜曲率半径 (mm):</label>
                <input type="number" id="rightEyeCR" name="rightEyeCR" step="0.01" placeholder="请输入右眼角膜曲率半径" required>
            </div>
            <div class="output" id="rightEyeSEOutput"></div>

            <button type="submit">提交</button>
        </form>
    </div>

    <script>
        document.getElementById('eyeDataForm').addEventListener('input', function() {
            const leftEyeAL = parseFloat(document.getElementById('leftEyeAL').value);
            const leftEyeCR = parseFloat(document.getElementById('leftEyeCR').value);
            const rightEyeAL = parseFloat(document.getElementById('rightEyeAL').value);
            const rightEyeCR = parseFloat(document.getElementById('rightEyeCR').value);

            const leftEyeSEOutput = document.getElementById('leftEyeSEOutput');
            const rightEyeSEOutput = document.getElementById('rightEyeSEOutput');

            if (!isNaN(leftEyeAL) && !isNaN(leftEyeCR)) {
                const leftSE = 43.86 - 14.73 * (leftEyeAL / leftEyeCR);
                leftEyeSEOutput.textContent = `左眼SE值: ${leftSE.toFixed(2)}`;
            } else {
                leftEyeSEOutput.textContent = '';
            }

            if (!isNaN(rightEyeAL) && !isNaN(rightEyeCR)) {
                const rightSE = 43.86 - 14.73 * (rightEyeAL / rightEyeCR);
                rightEyeSEOutput.textContent = `右眼SE值: ${rightSE.toFixed(2)}`;
            } else {
                rightEyeSEOutput.textContent = '';
            }
        });

        document.getElementById('eyeDataForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const leftEyeAL = document.getElementById('leftEyeAL').value;
            const leftEyeCR = document.getElementById('leftEyeCR').value;
            const rightEyeAL = document.getElementById('rightEyeAL').value;
            const rightEyeCR = document.getElementById('rightEyeCR').value;

            console.log('左眼眼轴长度:', leftEyeAL, 'mm');
            console.log('左眼角膜曲率半径:', leftEyeCR, 'mm');
            console.log('右眼眼轴长度:', rightEyeAL, 'mm');
            console.log('右眼角膜曲率半径:', rightEyeCR, 'mm');
        });
    </script>
</body>
</html>
